[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghound-agent-debug"
version = "0.1.0"
description = "Static step-level root-cause ranking for coding-agent trajectories"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12.0", "PyYAML>=6.0", "requests>=2.31"]

[project.scripts]
loghound-agent-debug = "loghound_agent_debug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
