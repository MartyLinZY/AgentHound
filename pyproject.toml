[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghound-agent-debug"
version = "0.1.0"
description = "Static step-level root-cause ranking for coding-agent trajectories"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
