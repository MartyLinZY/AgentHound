schema_version: "0.1.0"
semantic:
  query_task_weight: 0.4
  # Observation is ~76% of a RootSE trajectory and rewards verbose tool output.
  # Set to true to restore the pre-Day-1 behaviour.
  include_observation: false
graph:
  alpha: 0.85
  tolerance: 0.000001
  max_iterations: 1000
fusion:
  semantic: 0.5
  clue: 0.05
  path: 0.45
  denominator: 1
# RootSE-only override. Kept separate from `fusion` so the AgenTracer baseline
# and the linear rollback stay byte-identical. method: "linear" disables RRF.
fusion_rootse:
  method: "rrf"
  k: 60
  semantic: 0.4
  path: 1.0
  anchor: 1.0
  clue: 0.0
  misstep: 1.0
specificity:
  mode: "singleton"
  normalize: true
rootse_llm:
  request_params:
    reasoning_effort: high
    thinking:
      type: enabled
    max_tokens: 65536
  output_token_overrides:
    "rootse/swe-agent-live/gpt5mini/instance_sphinx-doc__sphinx-10435|18": 8192
    "rootse/swe-agent-live/claude-sonnet-4-5/instance_sympy__sympy-13878|65": 8192
rootse_misstep:
  prompt_version: "misstep_v1"
  format_version: "misstep_json_v1"
  weights:
    evidence_contradiction: 0.5
    requirement_misreading: 0.4
    unfounded_assumption: 0.4
    invalid_action: 0.4
  max_field_chars: 2000
  max_input_chars: 60000
  max_output_tokens: 8192
  max_summary_chars: 500
  max_requests_per_trajectory: 100
fusion_misstep:
  semantic: 0.40
  misstep: 0.35
  path: 0.25
  denominator: 1
